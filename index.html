<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0f0e">
<title>Westwood Sniper</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0d0f0e; overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #game {
    position: absolute; left: 0; top: 0;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
    outline: none;
  }
  #rotate {
    display: none; position: absolute; inset: 0;
    background: #0d0f0e; color: #7CFF7A;
    font: bold 16px/1.4 ui-monospace, Menlo, monospace;
    align-items: center; justify-content: center; text-align: center;
    letter-spacing: 2px; z-index: 10;
  }
  #rotate .phone {
    width: 34px; height: 56px; border: 3px solid #7CFF7A; border-radius: 6px;
    margin: 0 auto 18px; animation: rot 2.4s ease-in-out infinite;
  }
  @keyframes rot { 0%,30% { transform: rotate(0deg); } 60%,100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (max-width: 900px) and (pointer: coarse) {
    #rotate { display: flex; }
  }
  #boot {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #7CFF7A; font: 14px ui-monospace, Menlo, monospace; letter-spacing: 2px;
  }
</style>
</head>
<body>
<canvas id="game" width="480" height="270" tabindex="0"></canvas>
<div id="rotate"><div><div class="phone"></div>ROTATE DEVICE<br><span style="color:#FFB23A;font-size:12px">WESTWOOD SNIPER PLAYS IN LANDSCAPE</span></div></div>
<div id="boot">LOADING…</div>
<div id="safe" style="position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)"></div>
<noscript><p style="color:#7CFF7A;font-family:monospace;padding:20px">Westwood Sniper needs JavaScript.</p></noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
